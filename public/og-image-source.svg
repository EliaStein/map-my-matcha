<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#201208"/>
      <stop offset="50%" style="stop-color:#2e1a0c"/>
      <stop offset="100%" style="stop-color:#1a0e06"/>
    </linearGradient>

    <radialGradient id="ceramicOuter" cx="35%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#fdfaf5"/>
      <stop offset="40%" style="stop-color:#f2e8d8"/>
      <stop offset="75%" style="stop-color:#e0cdb5"/>
      <stop offset="100%" style="stop-color:#c8b498"/>
    </radialGradient>

    <radialGradient id="ceramicInner" cx="42%" cy="38%" r="62%">
      <stop offset="0%" style="stop-color:#ddc8ae"/>
      <stop offset="100%" style="stop-color:#b89e84"/>
    </radialGradient>

    <radialGradient id="matchaBase" cx="42%" cy="38%" r="65%">
      <stop offset="0%" style="stop-color:#88cc4e"/>
      <stop offset="35%" style="stop-color:#62b02a"/>
      <stop offset="75%" style="stop-color:#468c18"/>
      <stop offset="100%" style="stop-color:#2e6c08"/>
    </radialGradient>

    <radialGradient id="foamCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c8ec88" stop-opacity="0.9"/>
      <stop offset="55%" style="stop-color:#a8d860" stop-opacity="0.5"/>
      <stop offset="100%" style="stop-color:#88c040" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="50%" style="stop-color:#000" stop-opacity="0"/>
      <stop offset="100%" style="stop-color:#000" stop-opacity="0.72"/>
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="5" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <filter id="lightBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="matcha">
      <circle cx="600" cy="300" r="198"/>
    </clipPath>
  </defs>

  <!-- Background: dark wood -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Wood grain lines -->
  <g stroke="#4a280e" fill="none" stroke-linecap="round">
    <path d="M0 28 C200 22, 400 32, 600 28 S900 23, 1200 28" stroke-width="1.5" opacity="0.2"/>
    <path d="M0 55 C300 62, 500 50, 700 56 S1000 61, 1200 55" stroke-width="1" opacity="0.15"/>
    <path d="M0 84 C150 78, 400 88, 650 83 S950 78, 1200 84" stroke-width="1.8" opacity="0.18"/>
    <path d="M0 115 C250 122, 550 112, 800 118 S1050 123, 1200 115" stroke-width="1" opacity="0.14"/>
    <path d="M0 148 C350 142, 600 150, 850 146 S1100 141, 1200 148" stroke-width="1.5" opacity="0.17"/>
    <path d="M0 182 C200 188, 450 178, 700 184 S950 189, 1200 182" stroke-width="1.2" opacity="0.16"/>
    <path d="M0 218 C300 212, 550 220, 800 215 S1050 210, 1200 218" stroke-width="1" opacity="0.13"/>
    <path d="M0 255 C150 262, 400 252, 650 258 S950 263, 1200 255" stroke-width="1.6" opacity="0.18"/>
    <path d="M0 292 C250 286, 500 294, 750 290 S1050 285, 1200 292" stroke-width="1" opacity="0.14"/>
    <path d="M0 332 C350 338, 600 328, 850 334 S1100 339, 1200 332" stroke-width="1.4" opacity="0.16"/>
    <path d="M0 372 C200 366, 450 374, 700 370 S950 365, 1200 372" stroke-width="1" opacity="0.14"/>
    <path d="M0 412 C300 418, 550 408, 800 414 S1050 419, 1200 412" stroke-width="1.7" opacity="0.19"/>
    <path d="M0 455 C150 448, 400 456, 650 452 S950 447, 1200 455" stroke-width="1.2" opacity="0.15"/>
    <path d="M0 498 C250 504, 500 494, 750 500 S1050 505, 1200 498" stroke-width="1" opacity="0.13"/>
    <path d="M0 542 C350 536, 600 544, 850 540 S1100 535, 1200 542" stroke-width="1.5" opacity="0.17"/>
    <path d="M0 588 C200 594, 450 584, 700 590 S950 595, 1200 588" stroke-width="1.3" opacity="0.16"/>
    <path d="M0 620 C300 614, 550 622, 800 618 S1050 613, 1200 620" stroke-width="1" opacity="0.12"/>
  </g>

  <!-- Matcha powder scattered on wood -->
  <g opacity="0.5" filter="url(#softBlur)">
    <circle cx="258" cy="458" r="3.5" fill="#5aaa28"/>
    <circle cx="270" cy="468" r="2" fill="#4a9a1e"/>
    <circle cx="248" cy="472" r="2.5" fill="#62b230"/>
    <circle cx="280" cy="452" r="1.5" fill="#5aaa28"/>
    <circle cx="242" cy="462" r="3" fill="#4a9a1e"/>
    <circle cx="265" cy="480" r="1.8" fill="#5aaa28"/>
    <circle cx="935" cy="178" r="3" fill="#5aaa28"/>
    <circle cx="948" cy="168" r="2" fill="#4a9a1e"/>
    <circle cx="922" cy="185" r="2.2" fill="#62b230"/>
    <circle cx="955" cy="180" r="1.5" fill="#5aaa28"/>
    <circle cx="942" cy="192" r="2.8" fill="#4a9a1e"/>
    <circle cx="185" cy="335" r="2" fill="#5aaa28" opacity="0.8"/>
    <circle cx="195" cy="345" r="1.5" fill="#4a9a1e" opacity="0.7"/>
    <circle cx="1015" cy="415" r="2.2" fill="#5aaa28" opacity="0.8"/>
    <circle cx="1005" cy="428" r="1.5" fill="#4a9a1e" opacity="0.7"/>
    <circle cx="360" cy="548" r="2" fill="#5aaa28" opacity="0.6"/>
    <circle cx="840" cy="96" r="2.5" fill="#4a9a1e" opacity="0.65"/>
    <circle cx="130" cy="195" r="1.8" fill="#5aaa28" opacity="0.55"/>
    <circle cx="1070" cy="490" r="2" fill="#4a9a1e" opacity="0.6"/>
  </g>

  <!-- Tea leaves (atmospheric) -->
  <g transform="translate(892, 120) rotate(-35)">
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="#244e10" opacity="0.65"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#1a3c0a" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#1a3c0a" stroke-width="0.8" opacity="0.5"/>
  </g>
  <g transform="translate(318, 505) rotate(22)">
    <ellipse cx="0" cy="0" rx="24" ry="8" fill="#244e10" opacity="0.6"/>
    <line x1="-19" y1="0" x2="19" y2="0" stroke="#1a3c0a" stroke-width="1.2" opacity="0.75"/>
  </g>
  <g transform="translate(1065, 315) rotate(-52)">
    <ellipse cx="0" cy="0" rx="20" ry="7" fill="#244e10" opacity="0.5"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#1a3c0a" stroke-width="1" opacity="0.65"/>
  </g>

  <!-- Bowl ground shadow -->
  <ellipse cx="612" cy="537" rx="242" ry="26" fill="#000" opacity="0.45" filter="url(#softBlur)"/>

  <!-- Outer ceramic bowl with drop shadow -->
  <circle cx="600" cy="300" r="252" fill="url(#ceramicOuter)" filter="url(#dropShadow)"/>

  <!-- Inner ceramic wall ring -->
  <circle cx="600" cy="300" r="215" fill="url(#ceramicInner)"/>

  <!-- Shadow at rim-to-matcha junction -->
  <circle cx="600" cy="300" r="200" fill="none" stroke="#0f0800" stroke-width="8" opacity="0.3"/>

  <!-- Matcha surface -->
  <circle cx="600" cy="300" r="194" fill="url(#matchaBase)"/>

  <!-- Foam glow base (blurred) -->
  <g filter="url(#lightBlur)">
    <circle cx="600" cy="300" r="115" fill="#a8d860" opacity="0.32"/>
  </g>

  <!-- Organic foam clusters -->
  <g clip-path="url(#matcha)" filter="url(#softBlur)">
    <circle cx="600" cy="300" r="62" fill="#b0dc70" opacity="0.5"/>
    <circle cx="616" cy="287" r="40" fill="#c0e880" opacity="0.45"/>
    <circle cx="582" cy="316" r="33" fill="#b8e070" opacity="0.42"/>
    <circle cx="622" cy="319" r="25" fill="#b0dc68" opacity="0.4"/>
    <circle cx="579" cy="283" r="28" fill="#c0e880" opacity="0.44"/>
    <circle cx="650" cy="294" r="20" fill="#a8d860" opacity="0.38"/>
    <circle cx="553" cy="308" r="18" fill="#a8d860" opacity="0.35"/>
    <circle cx="606" cy="258" r="22" fill="#b0dc70" opacity="0.4"/>
    <circle cx="596" cy="342" r="18" fill="#a0cc58" opacity="0.36"/>
    <circle cx="640" cy="326" r="16" fill="#a8d860" opacity="0.36"/>
    <circle cx="560" cy="282" r="20" fill="#b8e070" opacity="0.4"/>
    <circle cx="660" cy="313" r="14" fill="#a0cc58" opacity="0.33"/>
    <circle cx="538" cy="300" r="16" fill="#a8d860" opacity="0.32"/>
    <circle cx="668" cy="280" r="16" fill="#a0cc58" opacity="0.35"/>
    <circle cx="537" cy="320" r="14" fill="#a0cc58" opacity="0.30"/>
  </g>

  <!-- Chasen whisk traces — curved, organic, not radiating from a single point -->
  <g clip-path="url(#matcha)" stroke="#3e8812" fill="none" opacity="0.22" stroke-linecap="round">
    <path d="M560 255 Q590 270 610 300 Q625 328 618 355" stroke-width="1.5"/>
    <path d="M640 252 Q620 278 608 305 Q598 330 610 360" stroke-width="1.5"/>
    <path d="M548 310 Q572 298 600 300 Q628 302 655 292" stroke-width="1.5"/>
    <path d="M555 268 Q568 290 575 315 Q580 338 568 358" stroke-width="1.2"/>
    <path d="M648 330 Q632 315 618 300 Q606 286 614 265" stroke-width="1.2"/>
    <path d="M538 330 Q562 318 582 308 Q605 296 625 275" stroke-width="1.2"/>
  </g>

  <!-- Crisp foam highlights -->
  <g clip-path="url(#matcha)">
    <circle cx="603" cy="297" r="11" fill="#daf0a0" opacity="0.65"/>
    <circle cx="591" cy="309" r="7.5" fill="#d0ec98" opacity="0.58"/>
    <circle cx="613" cy="309" r="6" fill="#daf0a0" opacity="0.55"/>
    <circle cx="602" cy="287" r="5.5" fill="#e2f4a8" opacity="0.62"/>
    <circle cx="616" cy="295" r="4.5" fill="#d8ee98" opacity="0.52"/>
    <circle cx="589" cy="294" r="4" fill="#e2f4a8" opacity="0.52"/>
    <!-- Subtle specular on matcha -->
    <ellipse cx="555" cy="244" rx="20" ry="9" fill="white" opacity="0.07" transform="rotate(-22, 555, 244)"/>
  </g>

  <!-- Ceramic rim highlights (light from upper-left) -->
  <path d="M 386 156 A 252 252 0 0 1 590 50" stroke="white" stroke-width="6" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M 393 170 A 252 252 0 0 1 584 62" stroke="white" stroke-width="3" fill="none" opacity="0.14" stroke-linecap="round"/>
  <path d="M 413 160 A 215 215 0 0 1 581 88" stroke="white" stroke-width="2.5" fill="none" opacity="0.11" stroke-linecap="round"/>

  <!-- Vignette -->
  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
